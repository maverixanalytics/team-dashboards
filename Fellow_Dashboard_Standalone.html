      function extractState(cityState) {
        if (!cityState || cityState === "TBD") return null;
        var parts = cityState.split(",");
        if (parts.length >= 2) { var st = parts[parts.length-1].trim(); if (st.length === 2) return st.toUpperCase(); }
        return null;

      var APPS_SCRIPT_URL = "";

      // Save fellow updates to Google Sheet via Apps Script
      function saveFellowUpdate(fellowId, updates) {
        var f = FELLOWS.find(function(x) { return x.id === fellowId; });
        if (!f) return Promise.reject("Fellow not found");
        // Update local data immediately
        Object.keys(updates).forEach(function(k) { f[k] = updates[k]; });
        assignTerritories();
        renderSidebar();
        // If no Apps Script URL configured, just save locally
        if (!APPS_SCRIPT_URL) {
          return Promise.resolve({success: true, local: true});
        }
        // POST to Apps Script
        return fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({rowNumber: f.rowNumber, updates: updates})
        }).then(function() { return {success: true}; });
      }

function assignTerritories() {
        FELLOWS.forEach(function(f) {
          var instState = extractState(f.instCity);
          if (instState && TERRITORIES[instState]) {
            f.instTerritory = TERRITORIES[instState].territory;
            if (!f.rep && TERRITORIES[instState].rep) {
              f.rep = TERRITORIES[instState].rep;
              f.repTerritory = TERRITORIES[instState].territory;
            }
          }
          var destState = extractState(f.destCity);
          if (destState && TERRITORIES[destState]) {
            f.destTerritory = TERRITORIES[destState].territory;
          }
        });
      }

function parseCSVtoFellows(csvText) {
  var result = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  if (!result.data || result.data.length === 0) return [];

  var headers = result.meta.fields;
  return result.data.map(function(row, i) {
    var instName = (row[headers[7]] || '').toString().toLowerCase().trim(); // Col H = Training Institution
    var instCoords = INSTITUTION_COORDS[instName] || {};

    return {
      id: i + 1,
      name: row[headers[2]] || '',           // C: Fellow's Full Name
      type: row[headers[3]] || '',           // D: Subspecialty
      email: row[headers[4]] || '',          // E: Fellow's Email
      phone: row[headers[5]] || '',          // F: Fellow's Phone
      linkedin: row[headers[6]] || '',       // G: Fellow's LinkedIn URL
      institution: row[headers[7]] || '',    // H: Training Institution
      instCity: '',
      instLat: parseFloat(row[headers[20]]) || instCoords.lat || null,  // U: Inst Latitude
      instLng: parseFloat(row[headers[21]]) || instCoords.lng || null,  // V: Inst Longitude
      progDirector: row[headers[8]] || '',   // I: Program Director
      completion: row[headers[9]] || '',     // J: Expected Completion Date
      destination: row[headers[10]] || 'TBD', // K: Destination Hospital
      destCity: row[headers[11]] || 'TBD',   // L: Destination City, State
      destLat: parseFloat(row[headers[18]]) || null,  // S: Dest Latitude
      destLng: parseFloat(row[headers[19]]) || null,  // T: Dest Longitude
      practiceType: row[headers[12]] || 'TBD', // M: Practice Type
      wishlist: row[headers[13]] || '',      // N: Equipment Wish List
      decisionMaker: row[headers[14]] || '', // O: Key Decision Maker(s)
      status: row[headers[16]] || 'Not Started', // Q: Status
      rep: row[headers[1]] || '',            // B: Your Name (Rep)
      repTerritory: row[headers[17]] || '',  // R: Rep Territory
      notes: row[headers[22]] || '',         // W: Rep Notes
      rowNumber: i + 2,                      // For writing back (row 1 = header)
    };
  }).filter(function(f) { return f.name; }); // Skip empty rows
}

const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

let markers = [];
let arcs = [];
let activeCardId = null;

const STATUS_COLORS = {
  "Not Started": "#78909c", "Contacted": "#4da6ff", "Meeting Scheduled": "#ffb74d",
  "Wish List Received": "#ab47bc", "Quoted": "#ff7043", "Won": "#66bb6a", "Lost": "#e53935"
};

function createIcon(color, size) {
  size = size || 10;
  return L.divIcon({
    className: '',
    html: '<div style="width:'+(size+4)+'px;height:'+(size+4)+'px;border-radius:50%;border:2.5px solid '+color+';background:rgba(15,23,36,0.7);box-shadow:0 0 6px '+color+';"></div>',
    iconSize: [size+4, size+4], iconAnchor: [(size+4)/2, (size+4)/2]
  });
}

function createDestIcon(color) {
  return L.divIcon({
    className: '',
    html: '<svg width="18" height="24" viewBox="0 0 18 24" style="filter:drop-shadow(0 0 6px '+color+');"><path d="M9 0C4 0 0 4 0 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z" fill="'+color+'" stroke="#fff" stroke-width="1.5"/><circle cx="9" cy="9" r="3.5" fill="#fff"/></svg>',
    iconSize: [18, 24], iconAnchor: [9, 24]
  });
}

function projectPoint(lat, lng) {
  return map.latLngToLayerPoint([lat, lng]);
}

function drawArc(f) {
  if (!f.destLat) return null;
  var isIP = f.type === "IP Fellow";
  var color = isIP ? "#4da6ff" : "#81c784";
  var arrowId = isIP ? 'arrow-ip' : 'arrow-gi';
  var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', '2.5');
  path.setAttribute('stroke-opacity', '0.55');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('marker-end', 'url(#' + arrowId + ')');
  path.dataset.fellowId = f.id;
  path.dataset.arrowId = arrowId;
  g.appendChild(path);
  return path;
}

function updateArcPath(path, f) {
  if (!path || !f.destLat) return;
  var p1 = projectPoint(f.instLat, f.instLng);
  var p2 = projectPoint(f.destLat, f.destLng);
  var dx = p2.x - p1.x;
  var dy = p2.y - p1.y;
  var dist = Math.sqrt(dx*dx + dy*dy);
  var bend = Math.min(dist * 0.3, 80);
  var mx = (p1.x + p2.x) / 2;
  var my = (p1.y + p2.y) / 2 - bend;
  path.setAttribute('d', 'M'+p1.x+','+p1.y+' Q'+mx+','+my+' '+p2.x+','+p2.y);
}

function renderMap(fellows) {
  markers.forEach(function(m) { map.removeLayer(m); });
  markers = [];
  while (g.firstChild) g.removeChild(g.firstChild);
  arcs = [];

  fellows.forEach(function(f) {
    var isTBD = !f.destLat;
    var color = isTBD ? "#ffb74d" : (f.type === "IP Fellow" ? "#4da6ff" : "#81c784");

    var originIcon = isTBD
      ? L.divIcon({
          className: '',
          html: '<div style="position:relative;width:20px;height:20px;"><div style="position:absolute;top:3px;left:3px;width:14px;height:14px;background:#ffb74d;border-radius:50%;border:2px solid #fff;box-shadow:0 0 10px #ffb74d;"></div><div style="position:absolute;top:0;left:0;width:20px;height:20px;border-radius:50%;border:2px solid #ffb74d;opacity:0.5;animation:tbdPulse 2s ease-in-out infinite;"></div></div>',
          iconSize: [20, 20], iconAnchor: [10, 10]
        })
      : createIcon(color, 10);

    if (!f.instLat || !f.instLng) return;

    var m1 = L.marker([f.instLat, f.instLng], { icon: originIcon })
      .addTo(map)
      .on('click', function() { selectFellow(f.id); });
    m1._fellowId = f.id;
    var tbdLabel = isTBD ? '<br><span style="color:#ffb74d;font-weight:600;">DESTINATION TBD</span>' : '';
    m1.bindTooltip('<b>'+f.name+'</b><br>'+f.institution+tbdLabel, { className: 'dark-tooltip', direction: 'top', offset: [0, -12] });
    markers.push(m1);

    if (f.destLat) {
      var m2 = L.marker([f.destLat, f.destLng], { icon: createDestIcon(color) })
        .addTo(map)
        .on('click', function() { selectFellow(f.id); });
      m2._fellowId = f.id;
      m2.bindTooltip('<b>'+f.name+'</b> &rarr; '+f.destination, { className: 'dark-tooltip', direction: 'top', offset: [0, -8] });
      markers.push(m2);

      var arc = drawArc(f);
      if (arc) {
        updateArcPath(arc, f);
        arcs.push({ path: arc, fellow: f });
      }
    }
  });
}

map.on('moveend zoomend', function() {
  arcs.forEach(function(a) { updateArcPath(a.path, a.fellow); });
});

var currentTab = 'fellows';

document.querySelectorAll('.sidebar-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.sidebar-tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderSidebar();
  });
});

function getFilteredFellows() {
  var search = document.getElementById('search').value.toLowerCase();
  var typeFilter = document.getElementById('filter-type').value;
  var statusFilter = document.getElementById('filter-status').value;
  return FELLOWS.filter(function(f) {
    if (typeFilter && f.type !== typeFilter) return false;
    if (statusFilter && f.status !== statusFilter) return false;
    if (search) {
      var haystack = (f.name+' '+f.institution+' '+f.destination+' '+f.destCity+' '+f.rep+' '+f.repTerritory+' '+f.wishlist).toLowerCase();
      if (haystack.indexOf(search) === -1) return false;
    }
    return true;
  });
}

function renderFellowsList(fellows) {
  return fellows.map(function(f) {
    var badgeClass = f.type === "IP Fellow" ? "badge-ip" : "badge-gi";
    var badgeLabel = f.type === "IP Fellow" ? "IP" : "GI";
    var statusClass = f.status.toLowerCase().replace(/\s+/g, '-');
    var isTBD = f.destination === "TBD";
    var dest = isTBD ? '<span style="color:#ffb74d;font-weight:600;">Destination TBD</span>' : f.destination;
    var wishTag = f.wishlist ? '<span class="wishlist-tag">Wish List</span>' : '';
    var notesTag = f.notes ? '<span class="wishlist-tag" style="background:rgba(77,166,255,0.15);color:#4da6ff;">Has Notes</span>' : '';
    return '<div class="fellow-card '+(activeCardId === f.id ? 'active' : '')+'" onclick="selectFellow('+f.id+')" style="'+(isTBD ? 'border-left:3px solid #ffb74d;' : '')+'">' +
      '<div class="name"><span class="status-dot status-'+statusClass+'"></span>'+f.name+'</div>' +
      '<span class="badge '+badgeClass+'">'+badgeLabel+'</span>' +
      '<span style="font-size:11px;color:#7a8a9e;">'+f.status+'</span>' +
      '<div class="route">'+f.institution+' <span class="arrow">&rarr;</span> '+dest+'</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">'+wishTag+notesTag+'</div>' +
    '</div>';
  }).join('');
}

function renderTerritoriesList(fellows) {
  var territories = {};
  fellows.forEach(function(f) {
    var key = f.rep || 'Unassigned';
    if (!territories[key]) territories[key] = { rep: f.rep || 'Unassigned', territory: f.repTerritory || 'TBD', fellows: [] };
    territories[key].fellows.push(f);
  });
  return Object.values(territories).sort(function(a,b) { return b.fellows.length - a.fellows.length; }).map(function(t) {
    var withWishlist = t.fellows.filter(function(f) { return f.wishlist; }).length;
    var placed = t.fellows.filter(function(f) { return f.destination !== "TBD"; }).length;
    var fellowRows = t.fellows.map(function(f) {
      return '<div class="territory-fellow-row" onclick="selectFellow('+f.id+')">' +
        '<span><span class="badge '+(f.type==='IP Fellow'?'badge-ip':'badge-gi')+'" style="font-size:9px;">'+(f.type==='IP Fellow'?'IP':'GI')+'</span> '+f.name+'</span>' +
        '<span class="dest">'+(f.destination === 'TBD' ? 'TBD' : f.destCity)+'</span>' +
      '</div>';
    }).join('');
    return '<div class="territory-card">' +
      '<div class="rep-name">'+t.rep+'</div>' +
      '<div class="rep-region">'+t.territory+'</div>' +
      '<div class="territory-stats">' +
        '<div class="territory-stat"><div class="val">'+t.fellows.length+'</div><div class="lbl">Fellows</div></div>' +
        '<div class="territory-stat"><div class="val">'+placed+'</div><div class="lbl">Placed</div></div>' +
        '<div class="territory-stat"><div class="val">'+withWishlist+'</div><div class="lbl">Wish Lists</div></div>' +
      '</div>' +
      '<div class="territory-fellows">'+fellowRows+'</div>' +
    '</div>';
  }).join('');
}

function renderSidebar() {
  var fellows = getFilteredFellows();
  var container = document.getElementById('sidebar-content');
  if (currentTab === 'fellows') {
    container.innerHTML = renderFellowsList(fellows);
  } else {
    container.innerHTML = renderTerritoriesList(fellows);
  }
  renderMap(fellows);
  updateKPIs(fellows);

function selectFellow(id) {
  activeCardId = id;
  var f = FELLOWS.find(function(x) { return x.id === id; });
  if (!f) return;

  arcs.forEach(function(a) {
    var aid = a.path.dataset.arrowId;
    if (parseInt(a.path.dataset.fellowId) === id) {
      a.path.setAttribute('stroke-width', '4');
      a.path.setAttribute('stroke-opacity', '1');
      a.path.setAttribute('marker-end', 'url(#'+aid+'-hi)');
    } else {
      a.path.setAttribute('stroke-width', '2.5');
      a.path.setAttribute('stroke-opacity', '0.2');
      a.path.setAttribute('marker-end', 'url(#'+aid+')');
    }
  });

  document.querySelectorAll('.fellow-card').forEach(function(c) { c.classList.remove('active'); });

  if (f.destLat && f.instLat) {
    var bounds = L.latLngBounds([[f.instLat, f.instLng], [f.destLat, f.destLng]]);
    map.fitBounds(bounds.pad(0.4));
  } else if (f.instLat) {
    map.setView([f.instLat, f.instLng], 6);
  }

  var badgeClass = f.type === "IP Fellow" ? "badge-ip" : "badge-gi";
  var statusColor = STATUS_COLORS[f.status] || "#78909c";
  document.getElementById('info-name').textContent = f.name;
  document.getElementById('info-badges').innerHTML = '<span class="badge '+badgeClass+'">'+f.type+'</span> <select class="info-editable-select" id="edit-status" onchange="">' + '<option value="Not Started"'+(f.status==="Not Started"?' selected':'')+'>Not Started</option>' + '<option value="Contacted"'+(f.status==="Contacted"?' selected':'')+'>Contacted</option>' + '<option value="Meeting Scheduled"'+(f.status==="Meeting Scheduled"?' selected':'')+'>Meeting Set</option>' + '<option value="Wish List Received"'+(f.status==="Wish List Received"?' selected':'')+'>Wish List</option>' + '<option value="Quoted"'+(f.status==="Quoted"?' selected':'')+'>Quoted</option>' + '<option value="Won"'+(f.status==="Won"?' selected':'')+'>Won</option></select>';

  var body = '<div class="info-section">' +
    '<h3>Training Program</h3>' +
    '<div class="info-row"><span class="label">Institution</span><span class="value">'+f.institution+'</span></div>' +
    '<div class="info-row"><span class="label">Completion</span><span class="value">'+f.completion+'</span></div>' +
    '<div class="info-row"><span class="label">Email</span><span class="value">'+f.email+'</span></div>' +
    '<div class="info-row"><span class="label">Phone</span><span class="value">'+f.phone+'</span></div>' +
    '<div class="info-row"><span class="label">Program Director</span><span class="value">'+f.progDirector+'</span></div>' + (f.rep ? '<div class="info-row"><span class="label">Assigned Rep</span><span class="value">'+f.rep+(f.repTerritory ? ' ('+f.repTerritory+')' : '')+'</span></div>' : '') + (f.instTerritory ? '<div class="info-row"><span class="label">Training Territory</span><span class="value">'+f.instTerritory+'</span></div>' : '') +
  '</div>' +
  '<div class="info-section">' +
    '<h3>Destination</h3>' +
    '<div class="info-row"><span class="label">Hospital</span><span class="value"><input class="info-editable" id="edit-destination" value="'+f.destination+'" placeholder="Enter hospital"></span></div>' +
    '<div class="info-row"><span class="label">Location</span><span class="value"><input class="info-editable" id="edit-destCity" value="'+f.destCity+'" placeholder="City, ST"></span></div>' +
    '<div class="info-row"><span class="label">Practice Type</span><span class="value"><input class="info-editable" id="edit-practiceType" value="'+f.practiceType+'" placeholder="e.g. Academic"></span></div>' +
    (f.rep ? '<div class="info-row"><span class="label">Assigned Rep</span><span class="value">'+f.rep+'</span></div>' : '') +
    (f.decisionMaker ? '<div class="info-row"><span class="label">Decision Maker</span><span class="value">'+f.decisionMaker+'</span></div>' : '') +
  '</div>';

  if (f.wishlist) {
    body += '<div class="info-section"><h3>Equipment Wish List</h3><div class="info-wishlist">'+f.wishlist+'</div></div>';
  }

  body += '<div class="info-save-bar"><button class="btn-save" onclick="handleSaveClick()">Save Changes</button><button class="btn-cancel" onclick="selectFellow(activeCardId)">Cancel</button></div><div class="save-status" id="save-status"></div>' + '<div class="info-section">' +
    '<h3>Notes for Destination Rep</h3>' +
    (f.rep ? '<div class="notes-from">From: '+f.rep+(f.repTerritory ? ' ('+f.repTerritory+')' : '')+'</div>' : '') + (f.destTerritory ? '<div class="info-row"><span class="label">Dest. Territory</span><span class="value">'+f.destTerritory+'</span></div>' : '') +
    '<div class="info-notes-box" contenteditable="true" data-fellow-id="'+f.id+'" data-row="'+f.rowNumber+'" onblur="saveNoteAPI(this)" placeholder="Add notes to help the destination rep...">'+( f.notes || '')+'</div>' +
    '<div style="font-size:10px;color:#556;margin-top:6px;font-style:italic;">Click to edit &mdash; notes auto-save when you click away</div>' +
  '</div>';

  document.getElementById('info-body').innerHTML = body;
  document.getElementById('info-panel').classList.add('visible');

  var container = document.getElementById('sidebar-content');
  if (currentTab === 'fellows') {
    container.innerHTML = renderFellowsList(getFilteredFellows());
  }
}

function closeInfoPanel() {
  document.getElementById('info-panel').classList.remove('visible');
  activeCardId = null;
  arcs.forEach(function(a) {
    a.path.setAttribute('stroke-width', '2.5');
    a.path.setAttribute('stroke-opacity', '0.55');
    a.path.setAttribute('marker-end', 'url(#'+a.path.dataset.arrowId+')');
  });

function saveNoteAPI(el) {
  var id = parseInt(el.dataset.fellowId);
  var rowNumber = parseInt(el.dataset.row);
  var text = el.innerText.trim();

  var f = FELLOWS.find(function(x) { return x.id === id; });
  if (f) f.notes = text;

  el.style.borderLeftColor = '#ffb74d'; // Saving...

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'saveNote', rowNumber: rowNumber, noteText: text })
  })
  .then(function(r) { return r.json(); })
  .then(function() {
    el.style.borderLeftColor = '#66bb6a'; // Green = saved
    setTimeout(function() { el.style.borderLeftColor = '#4da6ff'; }, 2000);
  })
  .catch(function() {
    el.style.borderLeftColor = '#ff7043'; // Orange = save unavailable
    // Show Safari-friendly message
    var msg = el.parentNode.querySelector('.save-warning');
    if (!msg) {
      msg = document.createElement('div');
      msg.className = 'save-warning';
      msg.style.cssText = 'font-size:10px;color:#ff7043;margin-top:4px;';
      msg.textContent = 'Note saved locally. To save to sheet, open dashboard in Chrome.';
      el.parentNode.appendChild(msg);
    }
  });
}

// Mobile sidebar toggle
function toggleSidebar() {
  var sidebar = document.querySelector('.sidebar');
  var overlay = document.getElementById('sidebar-overlay');
  var btn = document.getElementById('sidebar-toggle');
  var isOpen = sidebar.classList.contains('open');
  if (isOpen) {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
       sidebar.style.top = '';
       sidebar.style.height = '';
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg><span class="toggle-label">Fellows</span>';
  } else {
    var topOffset = document.querySelector('.topbar').offsetHeight + btn.offsetHeight;
       sidebar.style.top = topOffset + 'px';
       sidebar.style.height = 'calc(100vh - ' + topOffset + 'px)';
       sidebar.classList.add('open');
    overlay.classList.add('visible');
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg><span class="toggle-label">Close</span>';
  }
}
document.addEventListener('click', function(e) {
  if (window.innerWidth <= 768 && e.target.closest('.fellow-card')) {
    setTimeout(function() { toggleSidebar(); }, 200);
  }
});
